; Thermal Nexus ESP32 receiver: LoRa/serial input -> local MQTT broker.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM10
monitor_port = COM10
lib_deps =
    sandeepmistry/LoRa
    bblanchon/ArduinoJson
    256dpi/MQTT
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DWIFI_SSID=\"CHANGE_ME\"
    -DWIFI_PASSWORD=\"CHANGE_ME\"
    ; Use your laptop / Mosquitto broker LAN IP here. Do not use 127.0.0.1 on ESP32.
    -DMQTT_HOST=\"192.168.1.10\"
    -DMQTT_PORT=1883
    -DMQTT_TOPIC_PREFIX=\"thermal-nexus/v1\"
    -DNODE_ID=\"NODE_01\"
    -DRUN_ID=\"esp32-live-run\"
    -DLORA_FREQ=433E6
    -DLORA_SS=5
    -DLORA_RST=14
    -DLORA_DIO0=2
