[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-nexus"
version = "0.1.0"
description = "Software-only digital prototype for predictive cold-chain temperature monitoring."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "paho-mqtt>=2.1",
  "pyserial>=3.5",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["simulator*", "ml*", "protocol*", "host*"]

[tool.black]
line-length = 88
target-version = ["py310"]
exclude = '''
.*(
  [\\/]\.venv[\\/]
  | [\\/]\.matplotlib-cache[\\/]
  | [\\/]\.black-cache[\\/]
  | [\\/]\.pytest_cache[\\/]
  | [\\/]\.ruff_cache[\\/]
  | [\\/]ml[\\/]data[\\/]
  | [\\/]ml[\\/]models[\\/]
  | [\\/]evidence[\\/]
).*
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "external_t15_integration: requires the ignored full external T15 source dataset",
  "generated_artifact_integration: requires ignored generated external T15 artifacts",
  "integration: opt-in tests requiring external datasets (T15) or hardware",
  "external_t15: external T15 dataset tests (skipped on clean clone)",
  "hardware: hardware demonstrator tests (skipped without --runs-hardware)",
  "mqtt_integration: optional tests requiring a local MQTT broker",
]
