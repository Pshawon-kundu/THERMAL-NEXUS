[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-nexus"
version = "0.1.0"
description = "Software-only digital prototype for predictive cold-chain temperature monitoring."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["simulator*", "ml*", "protocol*", "host*"]

[tool.black]
line-length = 88
target-version = ["py310"]
exclude = '''
.*(
  [\\/]\.venv[\\/]
  | [\\/]\.matplotlib-cache[\\/]
  | [\\/]\.pytest_cache[\\/]
  | [\\/]\.ruff_cache[\\/]
  | [\\/]ml[\\/]data[\\/]
  | [\\/]evidence[\\/]
).*
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
