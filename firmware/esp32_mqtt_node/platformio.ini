; Thermal Nexus ESP32 MQTT node.
;
; Copy platformio_override.example.ini to platformio_override.ini for local Wi-Fi
; credentials. The override file is ignored by Git.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMQTT_MAX_PACKET_SIZE=768
    -DWIFI_SSID=\"YOUR_WIFI\"
    -DWIFI_PASSWORD=\"YOUR_PASSWORD\"
    -DMQTT_HOST=\"192.168.0.193\"
    -DMQTT_PORT=1883
    -DMQTT_TOPIC_PREFIX=\"thermal-nexus/v1\"
    -DNODE_ID=\"ESP32_DEV_01\"
    -DRUN_ID=\"ESP32_LIVE_001\"
    -DREAL_SENSOR=0
    -DSENSOR_INTERVAL_MS=1000
    -DMQTT_PUBLISH_INTERVAL_MS=2000
