; Copy this file to platformio_override.ini and fill in local secrets.
; platformio_override.ini is ignored by Git.

[env:esp32dev]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DMQTT_MAX_PACKET_SIZE=768
    -DWIFI_SSID=\"YOUR_WIFI\"
    -DWIFI_PASSWORD=\"YOUR_PASSWORD\"
    -DMQTT_HOST=\"192.168.0.193\"
    -DMQTT_PORT=1883
    -DMQTT_TOPIC_PREFIX=\"thermal-nexus/v1\"
    -DNODE_ID=\"ESP32_DEV_01\"
    -DRUN_ID=\"ESP32_LIVE_001\"
    -DREAL_SENSOR=0
    -DSENSOR_INTERVAL_MS=1000
    -DMQTT_PUBLISH_INTERVAL_MS=2000
