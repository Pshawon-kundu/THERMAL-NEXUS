defaults:
  random_seed: 20260718
  sample_interval_seconds: 60
  duration_seconds: 7200
  lower_limit_c: 2.0
  upper_limit_c: 8.0
  initial_temperature_c: 4.0
  ambient_temperature_c: 22.0
  sensor_noise_std_c: 0.08
  output_dir: ml/data/synthetic

scenarios:
  stable_cold:
    type: stable
    initial_temperature_c: 4.0
    drift_per_hour_c: 0.0
    sensor_noise_std_c: 0.05

  stable_room:
    type: stable
    initial_temperature_c: 22.0
    drift_per_hour_c: 0.0
    sensor_noise_std_c: 0.08

  gradual_warming:
    type: gradual_warming
    initial_temperature_c: 3.5
    final_temperature_c: 11.0
    response_time_seconds: 5400
    sensor_noise_std_c: 0.07

  rapid_warming:
    type: gradual_warming
    initial_temperature_c: 3.5
    final_temperature_c: 14.0
    response_time_seconds: 1200
    sensor_noise_std_c: 0.08

  cold_to_ambient:
    type: exponential_transition
    initial_temperature_c: 4.0
    target_temperature_c: 22.0
    time_constant_seconds: 1800
    sensor_noise_std_c: 0.08

  ambient_to_cold:
    type: exponential_transition
    initial_temperature_c: 22.0
    target_temperature_c: 4.0
    time_constant_seconds: 2100
    sensor_noise_std_c: 0.08

  short_door_opening:
    type: door_opening
    initial_temperature_c: 4.0
    ambient_temperature_c: 22.0
    event_start_seconds: 1800
    event_duration_seconds: 300
    warming_time_constant_seconds: 180
    recovery_time_constant_seconds: 900
    disturbance_strength: 0.45
    sensor_noise_std_c: 0.08

  long_door_opening:
    type: door_opening
    initial_temperature_c: 4.0
    ambient_temperature_c: 22.0
    event_start_seconds: 1800
    event_duration_seconds: 1200
    warming_time_constant_seconds: 300
    recovery_time_constant_seconds: 1200
    disturbance_strength: 0.65
    sensor_noise_std_c: 0.08

  repeated_door_opening:
    type: repeated_door_opening
    initial_temperature_c: 4.0
    ambient_temperature_c: 22.0
    event_starts_seconds: [1200, 2700, 4200, 5700]
    event_duration_seconds: 240
    warming_time_constant_seconds: 180
    recovery_time_constant_seconds: 900
    disturbance_strength: 0.42
    sensor_noise_std_c: 0.08

  sudden_spike:
    type: sudden_spike
    initial_temperature_c: 4.0
    event_start_seconds: 2400
    event_duration_seconds: 180
    spike_amplitude_c: 7.0
    recovery_time_constant_seconds: 600
    sensor_noise_std_c: 0.08

  sensor_drift:
    type: sensor_drift
    initial_temperature_c: 4.0
    true_drift_per_hour_c: 0.0
    measurement_drift_per_hour_c: 0.35
    sensor_noise_std_c: 0.05

  missing_samples:
    type: missing_samples
    initial_temperature_c: 4.0
    missing_probability: 0.12
    missing_burst_start_seconds: 3000
    missing_burst_duration_seconds: 600
    sensor_noise_std_c: 0.06

  temporary_sensor_fault:
    type: temporary_sensor_fault
    initial_temperature_c: 4.0
    fault_start_seconds: 2700
    fault_duration_seconds: 900
    sensor_noise_std_c: 0.06

